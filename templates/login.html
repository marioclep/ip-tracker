<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesion – IP Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background-color: #1a1d23; min-height: 100vh;
           display: flex; align-items: center; justify-content: center; }
    .login-card { width: 100%; max-width: 400px; }
    .brand-icon { font-size: 2.5rem; color: #0dcaf0; }
  </style>
</head>
<body>
  <div class="login-card p-4">
    <div class="text-center mb-4">
      <div class="brand-icon"><i class="bi bi-diagram-3-fill"></i></div>
      <h4 class="text-white mt-2 fw-bold">IP Tracker</h4>
      <p class="text-secondary small">Registro de asignaciones IP para ISPs</p>
    </div>
    <div class="card border-0 shadow-lg">
      <div class="card-body p-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
          <div class="alert alert-{{ category }} py-2 small">{{ message }}</div>
          {% endfor %}
        {% endwith %}
        <form method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label fw-semibold">Usuario</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input type="text" name="username" class="form-control"
                     autofocus autocomplete="username" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Contrasena</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" name="password" class="form-control"
                     autocomplete="current-password" required>
            </div>
          </div>
          <div class="mb-4 form-check">
            <input type="checkbox" name="remember" class="form-check-input" id="remember">
            <label class="form-check-label small" for="remember">Mantener sesion</label>
          </div>
          <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-box-arrow-in-right"></i> Iniciar sesion
          </button>
        </form>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
